      - "PuppetX::Glpi::ItemLinks#link_row"
      - "PuppetX::Glpi::Lookups#embedded_id"
      - "PuppetX::Glpi::Lookups#unique_computer"
      - "PuppetX::Glpi::Lookups#wanted_entity"
  InstanceVariableAssumption:
    # Providers and their mixins keep caches and per-run state across the Resource
    # API's callbacks, set by whichever callback runs first; lazy reads of it are
    # the write-through cache and purge guard design.
    exclude:
      - "Puppet::Provider::GlpiAppliance::GlpiAppliance"
      - "Puppet::Provider::GlpiBaseProvider"
      - "Puppet::Provider::GlpiComputerPlacement::GlpiComputerPlacement"
      - "Puppet::Provider::GlpiConfig::GlpiConfig"
      - "Puppet::Provider::GlpiCustomAsset::GlpiCustomAsset"
      - "Puppet::Provider::GlpiDomain::GlpiDomain"
      - "Puppet::Provider::GlpiItemPlacement::GlpiItemPlacement"
      - "Puppet::Provider::GlpiLocation::GlpiLocation"
      - "Puppet::Transport::Glpi"
  ManualDispatch:
    # Optional hooks and values of unknown class: a value that may be Sensitive, an
    # error that may carry a status, a provider that may lack a type hook. In
    # planned_deletions the check is the fail-closed test the purge guard rests on.
    exclude:
      - "Puppet::Provider::GlpiBaseProvider#reset_run_warnings"
      - "Puppet::Provider::GlpiBaseProvider#self.shared_transport"
      - "Puppet::Provider::GlpiConfig::GlpiConfig#read_entry"
      - "Puppet::Transport::Glpi#unwrap"
      - "Puppet::Type::GlpiApplianceMemberTypes#refresh_current_state"
      - "Puppet::Type::GlpiCustomAssetHooks#refresh_current_state"
      - "Puppet::Type::GlpiDomainHooks#refresh_current_state"
      - "Puppet::Type::GlpiTransportAutorequire#self.declared_titles"
      - "Puppet::Type::GlpiTransportAutorequire#self.planned_deletions"
      - "Puppet::Type::GlpiTransportAutorequire::DeletionPlanHook#flush"
      - "Puppet::Type::GlpiTransportAutorequire::InstancesFilter#glpi_key_of"
  MissingSafeMethod:
    # The validate_*! methods raise on bad input; there is no safe variant to offer.
    exclude:
      - "Puppet::Transport::Glpi"
  ModuleInitialize:
    # These modules are prepended to a generated type class and must wrap its
    # initialize: the hook is the point of the module.
    exclude:
      - "Puppet::Type::GlpiCustomAssetHooks"
      - "Puppet::Type::GlpiTransportAutorequire::DeletionPlanHook"
  NestedIterators:
    # Walking a list of objects per requested name or per scope; flattening these
    # would only move the same nesting into a block variable.
    exclude:
      - "Puppet::Provider::GlpiAppliance::GlpiAppliance#sync_members"
      - "Puppet::Provider::GlpiBaseProvider#list_resources"
      - "Puppet::Provider::GlpiCustomAsset::GlpiCustomAsset#fetch_objects"
      - "Puppet::Provider::GlpiDomain::GlpiDomain#wanted_contracts"
      - "Puppet::Provider::GlpiRule::GlpiRule#fetch_objects"
      - "PuppetX::Glpi::ItemLinks#write_links"
  NilCheck:
    # nil is meaningful throughout: an undeclared attribute is not managed, and a
    # missing object or an answer without an id must take a different path.
    exclude:
      - "/\\APuppet::Provider::GlpiBaseProvider#create\\z/"
      - "/\\APuppet::Provider::GlpiBaseProvider#delete\\z/"
      - "/\\APuppet::Provider::GlpiBaseProvider#update\\z/"
      - "/\\APuppet::Transport::Glpi#request\\z/"
      - "Puppet::Provider::GlpiAppliance::GlpiAppliance#insync?"
      - "Puppet::Provider::GlpiAppliance::GlpiAppliance#links"
      - "Puppet::Provider::GlpiAppliance::GlpiAppliance#record_link"
      - "Puppet::Provider::GlpiAppliance::GlpiAppliance#resource_to_api"
      - "Puppet::Provider::GlpiAppliance::GlpiAppliance#sync_members"
      - "Puppet::Provider::GlpiAppliance::GlpiAppliance#wanted_members"
      - "Puppet::Provider::GlpiBaseProvider#cacheable?"
      - "Puppet::Provider::GlpiBaseProvider#comment_body"
