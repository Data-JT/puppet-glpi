name: Bug report
description: Report reproducible module behaviour that differs from the documentation or expected GLPI behaviour.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include OAuth client secrets, passwords, API tokens, or private infrastructure details."
  - type: input
    id: module_version
    attributes:
      label: Module version or commit
    validations:
      required: true
  - type: input
    id: puppet_version
    attributes:
      label: Puppet version
    validations:
      required: true
  - type: input
    id: product_version
    attributes:
      label: GLPI version
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour and a redacted reproduction
    validations:
      required: true
