# --- 3. Shared-base detectors, per location -------------------------------
# DataClump and LongParameterList belong to section 1, and Reek cannot merge two
# entries for one detector in `detectors`. `directories` is a separate mapping:
# for files below a path it replaces that detector's configuration, so the
# thresholds of section 1 are repeated here and only the named classes differ.
directories:
  "lib/puppet/provider":
    DataClump:
      max_copies: 3
      exclude:
        # (context, name), (context, should) and (context, path) are the Resource
        # API's CRUD shape carried on into each provider's helpers, the same
        # exception section 1 grants the Proxmox providers. A parameter object
        # would change the signature of every helper of the safety code.
        - "Puppet::Provider::GlpiAppliance::GlpiAppliance"
        - "Puppet::Provider::GlpiBaseProvider"
        - "Puppet::Provider::GlpiCertificate::GlpiCertificate"
        - "Puppet::Provider::GlpiCustomAsset::GlpiCustomAsset"
        - "Puppet::Provider::GlpiDomain::GlpiDomain"
        - "Puppet::Provider::GlpiRule::GlpiRule"
  "lib/puppet/transport":
    DataClump:
      max_copies: 3
      exclude:
        # Each HTTP verb helper shares (context, path, body, query), as section 1
        # says of the Proxmox transports.
        - "Puppet::Transport::Glpi"
    LongParameterList:
      max_params: 5
      exclude:
        # The one request boundary and its retry loop; keywords keep the call
        # sites clear, and token, retry and resend handling live here.
        - "Puppet::Transport::Glpi#request"
        - "Puppet::Transport::Glpi#request_with_retries"
