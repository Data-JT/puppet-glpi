  RepeatedConditional:
    # The base tests the adoption policy, the marker and a missing object again at
    # each entry point (create, update, delete, insync?) on purpose: each guard must
    # hold on its own. The others are small shape checks of a title or an answer.
    exclude:
      - "Puppet::Provider::GlpiBaseProvider"
      - "Puppet::Provider::GlpiLocation::GlpiLocation"
      - "Puppet::Transport::Glpi"
  TooManyConstants:
    # API paths, limits and the patterns validating what reaches a GraphQL query.
    exclude:
      - "Puppet::Provider::GlpiBaseProvider"
      - "Puppet::Transport::Glpi"
  TooManyInstanceVariables:
    # Connection settings and tokens, or the provider's caches and per-run state.
    exclude:
      - "Puppet::Provider::GlpiBaseProvider"
      - "Puppet::Provider::GlpiCustomAsset::GlpiCustomAsset"
      - "Puppet::Transport::Glpi"
  TooManyMethods:
    # The base provider implements the contract every provider relies on and the
    # others keep one small method per concern; splitting them would scatter the
    # safety logic the base keeps in one reviewable place.
    exclude:
      - "Puppet::Provider::GlpiAppliance::GlpiAppliance"
      - "Puppet::Provider::GlpiBaseProvider"
      - "Puppet::Provider::GlpiCustomAsset::GlpiCustomAsset"
      - "Puppet::Provider::GlpiLocation::GlpiLocation"
      - "Puppet::Provider::GlpiRule::GlpiRule"
      - "Puppet::Transport::Glpi"
  TooManyStatements:
    # Linear sequences that read better whole: Resource API callbacks, mapping a
    # resource to a request body, and the safety paths (purge guard, marker and
    # adoption decisions, restore, read-back after a create, token and retry
    # handling), where splitting would hide the order the checks run in.
    # The transport constructor reads its settings one statement per key: Reek
    # excludes initialize by default, but an explicit list replaces the default.
    exclude:
      - "/\\APuppet::Provider::GlpiBaseProvider#create\\z/"
      - "/\\APuppet::Provider::GlpiBaseProvider#delete\\z/"
      - "/\\APuppet::Provider::GlpiBaseProvider#objects\\z/"
      - "/\\APuppet::Provider::GlpiBaseProvider#restore\\z/"
      - "/\\APuppet::Provider::GlpiBaseProvider#shared_list\\z/"
      - "/\\APuppet::Provider::GlpiBaseProvider#update\\z/"
      - "/\\APuppet::Provider::GlpiBaseProvider#warn_unmarked\\z/"
      - "/\\APuppet::Transport::Glpi#graphql\\z/"
      - "/\\APuppet::Transport::Glpi#request\\z/"
      - "/\\APuppetX::Glpi::Lookups#tree_path\\z/"
      - "Puppet::Provider::GlpiAppliance::GlpiAppliance#insync?"
      - "Puppet::Provider::GlpiAppliance::GlpiAppliance#member_plan"
      - "Puppet::Provider::GlpiAppliance::GlpiAppliance#refuse_unlinkable"
