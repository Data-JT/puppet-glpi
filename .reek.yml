      - "PuppetX::Glpi::Lookups#wanted_entity"
  FeatureEnvy:
    # These translate a resource hash or a raw GLPI object into another form, or
    # work on an HTTP response, so they refer to it more than to themselves.
    exclude:
      - "/\\APuppetX::Glpi::Lookups#tree_path\\z/"
      - "Puppet::Provider::GlpiAppliance::GlpiAppliance#plan_message"
      - "Puppet::Provider::GlpiAppliance::GlpiAppliance#refuse_unlinkable"
      - "Puppet::Provider::GlpiAppliance::GlpiAppliance#unique_member"
