---
# Reek configuration. The layout is shared with puppet-proxmox_virtual_environment,
# puppet-proxmox_backup_server and puppet-proxmox_datacenter_manager.
#
# CI runs Reek with a zero-warning baseline, so every exception is explicit,
# named and commented. Exceptions live only in this file: the code carries no
# inline :reek: comments.
#
# The single `detectors` mapping has two sections. Reek cannot merge two
# entries for the same detector, so each detector appears in exactly one:
#
#   1. Shared base, copied verbatim from the sibling modules: threshold tuning
#      for the method shapes the Puppet Resource API mandates, and the
#      exceptions those detectors need in any of the modules. Entries naming
#      Proxmox classes match nothing here and are kept so the block stays
#      identical.
#   2. Module-specific: named, per-location exceptions for this module only.
#
# A string under `exclude` matches every context whose full name contains it
# ("Class" or "Class#method"); a string written as "/.../" is a regular
# expression.
detectors:
  # --- 1. Shared base -------------------------------------------------------
  DataClump:
    # The Resource API's create/update/delete callbacks share
    # (context, name[, should]) by contract: exactly three methods. Raising
    # max_copies from 2 to 3 stops flagging that mandatory CRUD shape while
    # still catching a clump across four or more methods.
    max_copies: 3
    exclude:
      # Each transport's HTTP verb helpers share (context, path, body, query).
      - "/\\APuppet::Transport::Proxmox[A-Za-z]+\\z/"
      # proxmox_virtual_environment only: providers that pass (context, name)
      # to one helper beyond the CRUD triple, and the SDN providers that thread
      # (context, should) and (context, vnet) through their path helpers.
      - "Puppet::Provider::PveBackupJob::ProxmoxVirtualEnvironment"
      - "Puppet::Provider::PveRole::ProxmoxVirtualEnvironment"
      - "Puppet::Provider::PveSdnBaseProvider"
      - "Puppet::Provider::PveSdnSubnet::ProxmoxVirtualEnvironment"
      - "Puppet::Provider::PveStorage::ProxmoxVirtualEnvironment"
      - "Puppet::Provider::PveUser::ProxmoxVirtualEnvironment"
  LongParameterList:
    # insync?(context, name, attribute_name, is, should) is the Resource API's
    # mandated callback signature. Raising max_params from 3 to 5 stops
    # flagging that contract while still catching six or more parameters.
    max_params: 5
    exclude:
      # Each transport's generic call(context, method, path, body:, query:,
      # path_params:) is the public request boundary; keyword arguments keep
      # its call sites clear.
      - "/\\APuppet::Transport::Proxmox[A-Za-z]+#call\\z/"

  # --- 2. Module-specific (glpi) -------------------------------------------
  Attribute:
    # The once-per-process TLS warning flag is the transport class's own state.
    exclude:
      - "Puppet::Transport::Glpi#ssl_warning_emitted"
  BooleanParameter:
    # write_pending and raw select one of two documented behaviours; fold is the
    # case-folding switch of Names.key. Each is a keyword, clear at the call site.
    exclude:
      - "/\\APuppet::Transport::Glpi#request\\z/"
      - "Puppet::Provider::GlpiAppliance::GlpiAppliance#unresolved_members"
      - "Puppet::Provider::GlpiCustomAsset::GlpiCustomAsset#report_unresolved"
      - "PuppetX::Glpi::ItemLinks#report_unresolved_links"
      - "PuppetX::Glpi::Names#self.key"
  ControlParameter:
    # The Resource API's insync? callback is told which attribute to compare, and
    # answering only for some of them is the contract. The others take a value
    # whose nil or empty form means "not managed" or "none", which is GLPI's model.
    exclude:
      - "/\\APuppet::Transport::Glpi#request\\z/"
      - "Puppet::Provider::GlpiAppliance::GlpiAppliance#unresolved_members"
      - "Puppet::Provider::GlpiBaseProvider#insync?"
      - "Puppet::Provider::GlpiBaseProvider#wanted_value"
      - "Puppet::Provider::GlpiComputerPlacement::GlpiComputerPlacement#current_id"
      - "Puppet::Provider::GlpiComputerPlacement::GlpiComputerPlacement#wanted_id"
      - "Puppet::Provider::GlpiConfig::GlpiConfig#insync?"
      - "Puppet::Provider::GlpiCustomAsset::GlpiCustomAsset#declare_fields"
      - "Puppet::Provider::GlpiCustomAsset::GlpiCustomAsset#report_unresolved"
      - "Puppet::Provider::GlpiItemPlacement::GlpiItemPlacement#insync?"
      - "Puppet::Provider::GlpiLocation::GlpiLocation#insync?"
      - "Puppet::Provider::GlpiRule::GlpiRule#insync?"
      - "Puppet::Transport::Glpi#perform"
      - "PuppetX::Glpi::ItemLinks#report_unresolved_links"
      - "PuppetX::Glpi::Names#self.key"
  DuplicateMethodCall:
    # Repeated reads of a hash key, a memoized helper (transport) or a pure one
    # (resource_key, natural_key). A local variable would not make these clearer,
    # and in the safety code a reordered read is the larger risk. Time.now reads
    # are distinct instants on purpose.
    exclude:
      - "/\\APuppet::Provider::GlpiBaseProvider#create\\z/"
      - "/\\APuppet::Provider::GlpiBaseProvider#mark\\z/"
      - "/\\APuppet::Provider::GlpiBaseProvider#objects\\z/"
      - "/\\APuppet::Provider::GlpiBaseProvider#restore\\z/"
      - "/\\APuppet::Provider::GlpiBaseProvider#shared_list\\z/"
      - "/\\APuppet::Provider::GlpiBaseProvider#warn_unmarked\\z/"
      - "/\\APuppet::Transport::Glpi#graphql\\z/"
      - "/\\APuppet::Transport::Glpi#request\\z/"
      - "Puppet::Provider::GlpiAppliance::GlpiAppliance#api_to_resource"
      - "Puppet::Provider::GlpiAppliance::GlpiAppliance#insync?"
      - "Puppet::Provider::GlpiAppliance::GlpiAppliance#links"
      - "Puppet::Provider::GlpiAppliance::GlpiAppliance#member_plan"
      - "Puppet::Provider::GlpiAppliance::GlpiAppliance#plan_message"
